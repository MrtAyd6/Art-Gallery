<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Eser Detayı - Art Gallery</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="display: block; background-color: #f4f4f9;">
    
    <nav class="navbar">
        <a href="index.html" class="logo" style="text-decoration: none; color: inherit;">Art Gallery</a>
        <div class="user-menu" id="welcomeText">
            <a href="login.html" style="color: white; text-align: none;">Giriş Yap</a>
        </div>
    </nav>

    <main class="container" style="margin-top: 30px;">
        <div class="box" style="display: flex; gap: 30px; padding: 30px;">
            <div style="flex: 1;">
                <img id="artImage" src="Images/default.jpg" style="width: 100%; border-radius: 8px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);">
            </div>

            <div style="flex: 1; display: flex; flex-direction: column; justify-content: center;">
                <h1 id="artTitle" style="color: #2c3e50; margin-bottom: 10px;">Yükleniyor...</h1>
                <p id="artArtist" style="color: #7f8c8d; font-size: 18px; margin-bottom: 20px;">Sanatçı: ...</p>
                <p id="artDescription" style="color: #555; line-height: 1.6; margin-bottom: 30px;">
                    BU eşsiz sanat eseri, galerimizin en nadide parçalarından biridir, Detaylı fırça darbeleri ve derin anlamıyla koleksiyonunuza değer katacaktır.
                </p>

                <h2 id="artPrice" style="color: #e74c3c; font-size: 28px; margin-bottom: 30px;">0 ₺</h2>

                <div style="display: flex; gap: 15px;">
                    <button id="buyBtn" class="btn" style="flex: 2; font-size: 16px; background-color: #27ae60;">Satın Al</button>
                    <button id="addToFavBtn" class="btn-outline" style="width: 50px; font-size: 24px; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer;;">♥︎</button>
                </div>
            </div>
        </div>

        <div class="box" style="margin-top: 30px;">
            <h3 style="margin-bottom: 20px;">Eser Yorumları</h3>

            <!-- Yorum yazma formu -->
            <div id="commentFormContainer" style="margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid #eee;">
                <div style="margin-bottom: 10px; display: flex; align-items: center; gap: 10px;">
                    <span style="font-size: 14px; color: #555; font-weight: bold;">Puanınız:</span>
                    <div id="starRating" style="font-size: 24px; cursor: pointer; color: #ccc; user-select: none;">
                        <span data-value="1">★</span>
                        <span data-value="2">★</span>
                        <span data-value="3">★</span>
                        <span data-value="4">★</span>
                        <span data-value="5">★</span>
                    </div>
                </div>
                
                <textarea id="commentText" placeholder="Bu eser hakkında ne düşünüyorsunuz?" style="width: 100%; height: 80px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 10px; resize: vertical; font-family: inherit;"></textarea>
                <button id="submitCommentBtn" class="btn" style="background-color: #3498db; padding: 8px 16px; font-size: 14px;">Yorumu Gönder</button>
                <p id="commentMessage" style="margin-top: 10px; font-size: 14px;"></p>
            </div>

            <!-- Yorumların listelendiği yer -->
            <div id="commentList">
                <p style="color: #7f8c8d;">Yükleniyor...</p>
            </div>
        </div>
    </main>

    <script src="js/index.js"></script>
    <script src="js/artwork-detail.js"></script>
</body>
</html>
