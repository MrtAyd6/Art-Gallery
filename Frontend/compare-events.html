<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Etkinlik Karşılaştırma - Art Gallery</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; color: #333; margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center;max-width: 1200px; margin: 0 auto 30px auto; }
        .back-btn { background: #34495e; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; font-weight: bold; }
        .clear-btn { background: #e74c3c; color: white; padding: 10px 20px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;}

        .compare-table { width: 100%; max-width: 1200px; margin: 0 auto; background: white; border-collapse: collapse; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05); border-radius: 8px; overflow: hidden;}
        .compare-table th, .compare-table td { padding: 15px; border: 1px solid #eee; text-align: center; vertical-align: middle; }
        .compare-table th { background-color: #eafaf1; color: #27ae60; font-size: 16px; width: 15%; text-align: right; padding-right: 20px; }
        .compare-table td {width: 25%; }

        .event-title { font-size: 20px; font-weight: bold; color: #2c3e50; margin: 0 0 10px 0; }
        .price { color: #2980b9; font-weight: bold; font-size: 18px; }
        .session-box { background:  #fdfdfd; border: 1px solid #eee; padding: 5px; margin-bottom: 5px; border-radius: 4px; font-size: 13px; }

        #emptyState { text-align: center; margin-top: 50px; display: none; }
    </style>
</head>
<body>

    <div class="header">
        <a href="events.html" class="back-btn">Etkinliklere Dön</a>
        <h2 style="margin: 0; color: #27ae60;">Etkinlikleri Karşılaştırma</h2>
        <button class="clear-btn" onclick="clearEventComparison()">Listeyi Temizle</button>
    </div>

    <table class="compare-table" id="compareEventTable" style="display: none;"></table>

    <div id="emptyState">
        <h3 style="color: #7f8c8d;">Karşılaştırma listesi boş.</h3>
        <p>Lütfen ana sayfadab karşılaştırmak istediğiniz etkinlkleri seçin.</p>
    </div>

    <script src="js/compare-events.js"></script>
</body>
</html>
