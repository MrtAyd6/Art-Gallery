<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Etkinlik Detayı - Art Gallery</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="display: block; background-color: #f4f4f9;">
    <nav class="navbar">
        <a href="index.html" class="logo" style="text-decoration: none; color: inherit;">Art Gallery</a>
        <div class="user-menu"><a href="events.html" style="color: white;">Geri Dön</a></div>
    </nav>

    <main class="container">
        <div style="display: flex; justify-content: flex-end;">
            <div id="averageRatingBadge" style="display: none; align-items: center; gap: 5px; background: #fff; border: 1px solid #f1c40f; padding: 6px 12px; border-radius: 20px; font-weight: bold; font-size: 16px; color: #2c3e50; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05); width: fit-content; margin-bottom: 15px;"></div>
        </div>

        <div id="eventDetailContent" class="box" style="max-width: 800px; margin: auto;">
            <p>Yükleniyor...</p>
        </div>

        <hr style="margin: 40px 0; border: 1px solid #ddd;">

        <!-- Yorumlar -->
        <div class="box" style="margin: 30px;">
            <h3 style="margin-bottom: 20px;">Değerlendirmeler ve Yorumlar</h3>

            <div id="commentFormContainer" style="margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid #eee;">
                
                <div style="margin-bottom: 10px; display: flex; align-items: center; gap: 10px;">
                    <span style="font-size: 14px; color: #555; font-weight: bold;">Etkinlik Puanınız:</span>
                    <div id="starRating" style="font-size: 24px; cursor: pointer; color: #ccc; user-select: none;">
                        <span data-value="1">★</span>
                        <span data-value="2">★</span>
                        <span data-value="3">★</span>
                        <span data-value="4">★</span>
                        <span data-value="5">★</span>
                    </div>
                </div>

                <textarea id="commentText" placeholder="Etkinlik hakkında ne düşünüyorsunuz?" style="width: 100%; height: 80px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 10px; resize: vertical; font-family: inherit; box-sizing: border-box;"></textarea>
                <button id="submitCommentBtn" class="btn" style="background-color: #3498db; padding: 10px; font-size: 14px; width: 100%; cursor: pointer;">Yorum Gönder</button>
                <p id="commentMessage" style="margin-top: 10px; font-size: 14px;"></p>
            </div>

            <div style="display: flex; justify-content: flex-end;">
                <select id="commentSorter" style="padding: 8px; border-radius: 6px; border: 1px solid #ccc; background: #fdfdfd; cursor: pointer; color: #2c3e50; font-weight: bold;">
                    <option value="newest">En Yeni</option>
                    <option value="highest">En Yüksek Puanlı</option>
                    <option value="mostUsefull">En Faydalı</option>
                </select>
            </div>
            
            <div id="eventCommentList">
                <p style="color: #7f8c8d;">Yorumlar yükleniyor...</p>
            </div>
        </div>
    </main>

    

    <script src="js/event-detail.js"></script>
</body>
</html>
