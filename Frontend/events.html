<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atölyeler ve Etkinlikler</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="height: auto; display: block; background-color: #f4f4f9;">
    
    <nav class="navbar">
        <a href="index.html" class="logo" style="text-decoration: none; color: inherit;">Art Gallery</a>
        <div class="user-menu" id="welcomeText">
            <a href="index.html" style="color: white; text-decoration: none; margin-right: 15px; font-weight: 600;">Galeri</a>
            <a href="profile.html" style="color: white; text-decoration: none; margin-right: 15px; font-weight: 600;">Profilim</a>
            <span id="userNameDisplay">Yükleniyor...</span>
            <button id="logoutBtn" class="btn-small">Çıkış Yap</button>
        </div>
    </nav>

    <main class="container">

         <div id="campaignsSection" style="display: none; margin-bottom: 40px; background: linear-gradient(135deg, #fff5f5, #ffeaa7); padding: 20px; border-radius: 12px; border: 2px dashed #e17055; box-shadow: 0 4px 15px rgba(225, 112, 85, 0.2);">
            <h2 style="color: #d25400; margin-top: 0;">Kampanyalı Etkinlikler</h2>
            <div id="campaignsList" style="display: flex; gap: 20px; overflow-x: auto; padding-bottom: 10px;"></div>
        </div>

        <h2>Yaklaşan Sanat Atölyeleri</h2>
        <p style="margin-bottom: 20px; color: #7f8c8d;">Kontenjanı dolmadan yerinizi ayırın!</p>

        <div id="eventsGrid" class="grid-container">
            <p>Etkinlikler yükleniyor...</p>
        </div>

    </main>

    <a href="support.html" class="floating-support-btn" title="Yardım ve Destek">💬</a>

    <div id="compareEventFloatingBtn" style="display: none; position: fixed; bottom: 85px; left: 30px; background-color: #27ae60; color: white; padding: 12px 25px; border-radius: 30px; cursor: pointer; box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3); z-index: 1000; font-weight: bold; font-size: 16px; transition: all 0.3s ease;" onclick="window.location.href='compare-events.html'" onmouseover="this.style.backgroundColor='#2ecc71'" onmouseout="this.style.backgroundColor='#27ar60'">
        ⚖️ <span id="compareEventCount">0</span> Etkinliği Karşılaştır
    </div>

    <script src="js/events.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
