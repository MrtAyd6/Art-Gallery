<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanat Galerisi</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="height: auto; display: block; background-color: #f4f4f9;"> 
    <nav class="navbar">
        <a href="index.html" class="logo" style="text-decoration: none; color: inherit;">Art Gallery</a>
        <div class="user-menu" id="welcomeText">
            <a href="events.html" style="color: #f1c40f; text-decoration: none; margin-right: 15px; font-weight: bold;">Atölyeler</a>
            <span id="userNameDisplay">Yükleniyor...</span>
            <button id="logoutBtn" class="btn-small">Çıkış Yap</button>
        </div>
    </nav>

    <main class="container">
        
        <div id="campaignsSection" style="display: none; margin-bottom: 40px; background: linear-gradient(135deg, #fff5f5, #ffeaa7); padding: 20px; border-radius: 12px; border: 2px dashed #e17055; box-shadow: 0 4px 15px rgba(225, 112, 85, 0.2);">
            <h2 style="color: #d25400; margin-top: 0;">Kampanyalı Eserler</h2>
            <div id="campaignsList" style="display: flex; gap: 20px; overflow-x: auto; padding-bottom: 10px;"></div>
        </div>

        <h2>Sergilenen Eserler</h2>

        <div id="galleryGrid" class="grid-container">
            <p>Eserler yükleniyor...</p>
        </div>
    </main>

    <a href="support.html" class="floating-support-btn" title="Yardım ve Destek">💬</a>

    <div id="compareFloatingBtn" style="display: none; position: fixed; bottom: 30px; left: 30px; background-color: #2980b9; color: white; padding: 12px 25px; border-radius: 30px; cursor: pointer; box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3); z-index: 1000; font-weight: bold; font-size: 16px; transition: all 0.3s ease;" onclick="window.location.href='compare-artwork.html'" onmouseover="this.style.backgroundColor='#3498db'" onmouseout="this.style.backgroundColor='#298b9'">
        ⚖️<span id="compareCount">0</span> Eseri Karşılaştır
    </div>

    <script src="js/gallery.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
